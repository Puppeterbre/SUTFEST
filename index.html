<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUT FEST 2026 - Program</title>

<style>
:root {
    --red: #ec002f;
    --dark-red: #8b0008;
    --yellow: #ffb703;
    --cream: #fff8ed;
    --paper: #ffffff;
    --ink: #221414;
    --muted: #725f5f;
    --line: rgba(139, 0, 8, .13);
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #fffdf8 0%, var(--cream) 100%);
}

.page {
    width: min(940px, calc(100% - 32px));
    margin: 0 auto;
    padding: 30px 0;
}

/* HERO */
.hero {
    text-align: center;
    padding: 34px 22px;
    border-radius: 30px;
    background: rgba(255,255,255,0.8);
}

.logo-wrap {
    width: 180px;
    margin: 0 auto 10px;
}

.logo-img {
    width: 100%;
}

h1 {
    margin: 0;
    color: var(--red);
    font-size: 3rem;
    text-transform: uppercase;
}

.subtitle {
    color: var(--muted);
}

/* TABS */
.tabs {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

.tab-btn {
    flex: 1;
    padding: 12px;
    border-radius: 20px;
    border: none;
    background: #eee;
    cursor: pointer;
    font-weight: 600;
}

.tab-btn.active {
    background: var(--red);
    color: white;
}

/* EVENTS */
.event-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.event-item {
    border-radius: 15px;
    background: white;
    padding: 15px;
}

.event-item.headliner {
    border: 2px solid var(--red);
    background: #fff7cb;
}

/* 🔥 NOVA SATNICA */
.time {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-height: 38px;
    border-radius: 999px;
    background: rgba(236, 0, 47, .09);
    color: var(--red);
    font-weight: 900;
    font-size: .92rem;
    white-space: nowrap;
}

/* TITLES */
.title {
    font-weight: 700;
}

.meta {
    font-size: 0.9rem;
    color: var(--muted);
}

.footer {
    margin-top: 30px;
    text-align: center;
    font-size: 0.8rem;
    color: #777;
}
</style>
</head>

<body>

<div class="page">

<header class="hero">
<div class="logo-wrap">
<img src="SUT krug.png" class="logo-img">
</div>
<h1>SUT FEST 2026</h1>
<p class="subtitle">Tri dana improvizacije, nastupa, druženja i završne žurke.</p>
</header>

<div class="tabs">
<button class="tab-btn active">11. jun</button>
<button class="tab-btn">12. jun</button>
<button class="tab-btn">13. jun</button>
</div>

<div class="event-list">

<div class="event-item">
<div class="time">19:00–20:30</div>
<div class="title">DELI PROSTOR · Otvaranje izložbe</div>
<div class="meta">Svečano otvaranje festivala</div>
</div>

<div class="event-item">
<div class="time">21:00</div>
<div class="title">Prednastup</div>
<div class="meta">Stand up open mic</div>
</div>

<div class="event-item headliner">
<div class="time">21:15–23:15</div>
<div class="title">SUT · Scena u trenu</div>
<div class="meta">Glavni program</div>
</div>

</div>

<footer class="footer">
© 2026 SUT FEST
</footer>

</div>

</body>
</html>
